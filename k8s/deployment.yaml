apiVersion: apps/v1
kind: Deployment
metadata:
  name: "kimagentdemo"
  namespace: "agents-genaiteam"
  labels:
    app: "kimagentdemo"
    team: "genaiteam"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "kimagentdemo"
  template:
    metadata:
      labels:
        app: "kimagentdemo"
        team: "genaiteam"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "sa-kimagentdemo"
      containers:
        - name: "kimagentdemo"
          image: "acragenticdemopoc.azurecr.io/agents/kimagentdemo:latest"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: "config-kimagentdemo"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
